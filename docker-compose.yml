services:
  # --- Central Flask Backend Brain (PostgreSQL Network-Enabled) ---
  gateway_server:
    image: medical-iot-pipeline-gateway_server
    container_name: gateway_server
    command: sh -c "pip install psycopg2-binary requests paho-mqtt && gunicorn --workers 1 --worker-class gevent --bind 0.0.0.0:5000 gateway_server:app"
    networks:
      wms-net:
        aliases:
          - wms_gateway_server
    volumes:
      - telemetry_data:/app/data
      - ./gateway_server.py:/app/gateway_server.py
      - ./alerts.py:/app/alerts.py
      - ./templates/dashboard.html:/app/templates/dashboard.html
    environment:
      - DATABASE_PATH=/app/data/telemetry.db
      - FLASK_ENV=production
      - PG_HOST=iot_database
      - PG_USER=dale_admin
      - PG_PASSWORD=secure_telemetry_pass
      - PG_DB=iot_telemetry
      - MQTT_HOST=iot_broker
    ports:
      - "8080:5000"
    restart: always
    depends_on:
      - iot_database
      - iot_broker

  # --- Automated Fleet Data Simulator (MQTT Message Enabled) ---
  wms_fleet_simulator:
    image: medical-iot-pipeline-fleet_simulator
    container_name: wms_fleet_simulator
    command: sh -c "pip install paho-mqtt && python simulator.py"
    networks:
      - wms-net
    volumes:
      - ./simulator.py:/app/simulator.py
    environment:
      - MQTT_HOST=iot_broker
    depends_on:
      - gateway_server
      - iot_broker
    restart: always

  # --- Time-Series Persistent Storage (TimescaleDB) ---
  iot_database:
    image: timescale/timescaledb:latest-pg15
    container_name: iot_database
    networks:
      - wms-net
    environment:
      - POSTGRES_USER=dale_admin
      - POSTGRES_PASSWORD=secure_telemetry_pass
      - POSTGRES_DB=iot_telemetry
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  # --- Open-Source MQTT Message Broker ---
  iot_broker:
    image: eclipse-mosquitto:2
    container_name: iot_broker
    networks:
      - wms-net
    ports:
      - "1883:1883"
    volumes:
      - mosquitto_config:/mosquitto/config
    command: mosquitto -c /mosquitto/config/mosquitto.conf
    restart: always

  # --- Industrial Visualization Suite ---
  iot_grafana:
    image: grafana/grafana-oss:latest
    container_name: iot_grafana
    ports:
      - "3000:3000"
    networks:
      - wms-net
    volumes:
      - grafana_data:/var/lib/grafana
    restart: always
    depends_on:
      - iot_database

networks:
  wms-net:
    name: wms-secure-net
    driver: bridge

volumes:
  telemetry_data:
    name: telemetry_data
  postgres_data:
    name: postgres_data
  mosquitto_config:
    name: mosquitto_config
  grafana_data:
    name: grafana_data
