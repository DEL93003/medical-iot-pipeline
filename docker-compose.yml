services:
  # --- Mosquitto MQTT Broker ---
  iot_broker:
    image: eclipse-mosquitto:2.0
    container_name: iot_broker
    ports:
      - "1883:1883"
      - "8883:8883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./certs:/mosquitto/certs
    networks:
      - wms-net
    restart: always

  # --- TimescaleDB Hypertable Database ---
  iot_database:
    image: timescale/timescaledb:latest-pg16
    container_name: iot_database
    environment:
      - POSTGRES_DB=iot_telemetry
      - POSTGRES_USER_FILE=/run/secrets/pg_user
      - POSTGRES_PASSWORD_FILE=/run/secrets/pg_password
    secrets:
      - pg_user
      - pg_password
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - wms-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dale_admin -d iot_telemetry"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  # --- Telemetry Ingestion Consumer ---
  mqtt_consumer:
    build: .
    container_name: mqtt_consumer
    command: python -u src/server/mqtt_consumer.py
    networks:
      - wms-net
    volumes:
      - ./src:/app/src
      - ./certs:/app/certs:ro
    secrets:
      - pg_user
      - pg_password
    environment:
      - PYTHONUNBUFFERED=1
      - MQTT_HOST=iot_broker
      - MQTT_PORT=8883
      - MQTT_USER=wms_gateway
      - MQTT_PASSWORD=gateway_secure_pass
      - CA_CERT_PATH=/app/certs/ca.crt
      - PG_HOST=iot_database
      - PG_DB=iot_telemetry
      - PG_USER_FILE=/run/secrets/pg_user
      - PG_PASSWORD_FILE=/run/secrets/pg_password
      - TICKETING_WEBHOOK_URL=http://ticketing_service:6000/webhook
    depends_on:
      iot_broker:
        condition: service_started
      iot_database:
        condition: service_healthy
    restart: always

  # --- REST Telemetry Microservice ---
  telemetry_api:
    build: .
    image: medical-iot-pipeline-api
    container_name: telemetry_api
    command: python -m uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    networks:
      - wms-net
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./certs:/app/certs:ro
    secrets:
      - pg_user
      - pg_password
    environment:
      - PYTHONUNBUFFERED=1
      - MQTT_HOST=iot_broker
      - MQTT_PORT=8883
      - MQTT_USER=wms_device
      - MQTT_PASSWORD=device_secure_pass
      - CA_CERT_PATH=/app/certs/ca.crt
      - PG_HOST=iot_database
      - PG_DB=iot_telemetry
      - PG_USER_FILE=/run/secrets/pg_user
      - PG_PASSWORD_FILE=/run/secrets/pg_password
    depends_on:
      iot_database:
        condition: service_healthy
      iot_broker:
        condition: service_started
    restart: always

  # --- Multi-Device Edge Simulator ---
  wms_fleet_simulator:
    build: .
    container_name: wms_fleet_simulator
    command: python -u src/client/simulator.py
    networks:
      - wms-net
    volumes:
      - ./src:/app/src
      - ./certs:/app/certs:ro
    environment:
      - PYTHONUNBUFFERED=1
      - MQTT_HOST=iot_broker
      - MQTT_PORT=8883
      - MQTT_USER=wms_device
      - MQTT_PASSWORD=device_secure_pass
      - CA_CERT_PATH=/app/certs/ca.crt
    depends_on:
      iot_broker:
        condition: service_started
    restart: always

  # --- Biomedical Incident Ticketing Microservice ---
  ticketing_service:
    build: .
    container_name: ticketing_service
    command: python -u ticketing_service.py
    ports:
      - "6000:6000"
    networks:
      - wms-net
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
    restart: always

  # --- Grafana Dashboard Engine ---
  iot_grafana:
    image: grafana/grafana:latest
    container_name: iot_grafana
    ports:
      - "3000:3000"
    networks:
      - wms-net
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin_dashboard_pass
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      iot_database:
        condition: service_healthy
    restart: always

networks:
  wms-net:
    driver: bridge

volumes:
  timescaledb_data:
  grafana_data:

secrets:
  pg_user:
    file: .docker_secrets/postgres_user.txt
  pg_password:
    file: .docker_secrets/postgres_password.txt
