events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name localhost;

        # Route 1: Main Dashboard HTML UI
        location / {
            proxy_pass http://gateway_server:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Route 2: Aligned Persistent Telemetry Stream Proxy Mapping
        location /dashboard/stream {
            proxy_pass http://gateway_server:5000/api/v1/dashboard/stream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Route 3: Inbound Telemetry Ingestion API
        location /api/v1/telemetry {
            proxy_pass http://gateway_server:5000/api/v1/telemetry;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
