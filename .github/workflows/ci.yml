name: Medical IoT Pipeline CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Lint, Test & Validate Stack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8 pytest pytest-cov gunicorn

      - name: Code Quality & Linting
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,__pycache__

      - name: Provision CI Secrets & Directory Permissions
        run: |
          mkdir -p .docker_secrets logs templates
          chmod -R 777 logs
          if [ -d "mosquitto" ]; then chmod -R 777 mosquitto; fi
          echo "postgres" > .docker_secrets/pg_user.txt
          echo "password" > .docker_secrets/pg_password.txt
          echo "ci_jwt_test_secret_key_32bytes_long" > .docker_secrets/jwt_secret.txt

      - name: Build and Start Docker Compose Stack
        run: |
          docker compose up -d --build

      - name: Wait for Stack Readiness
        run: |
          for i in {1..30}; do
            if docker compose ps gateway_server | grep -q "(healthy)"; then
              echo "Stack is healthy and ready for testing!"
              break
            fi
            echo "Waiting for stack startup..."
            sleep 2
          done

      - name: Output Container Logs on Failure
        if: failure()
        run: |
          echo "=== Gateway Logs ==="
          docker compose logs gateway_server
          echo "=== Broker Logs ==="
          docker compose logs iot_broker
          echo "=== Consumer Logs ==="
          docker compose logs mqtt_consumer
          echo "=== Database Logs ==="
          docker compose logs iot_database
          echo "=== Container Status ==="
          docker compose ps -a

      - name: Run E2E Test Suite
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          MQTT_HOST: localhost
          MQTT_PORT: 8883
        run: |
          pytest -v tests/

      - name: Tear Down Stack
        if: always()
        run: |
          docker compose down -v
