name: Medical IoT Pipeline CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Lint, Test & Validate Stack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8 pytest pytest-cov

      - name: Code Quality & Linting
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,__pycache__

      - name: Start Full Docker Compose Stack
        run: |
          docker compose up -d
          # Give services a few seconds to initialize
          sleep 10

      - name: Run E2E Test Suite
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          MQTT_HOST: localhost
          MQTT_PORT: 8883
        run: |
          pytest -v tests/

      - name: Tear Down Stack
        if: always()
        run: |
          docker compose down -v
